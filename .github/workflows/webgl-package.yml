name: Unity package
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test 'Tools~/package.test.mjs'
