name: WebGL package
on:
  pull_request:
    paths: ['WebGL~/**', '.github/workflows/webgl-package.yml']
  push:
    branches: [main]
    paths: ['WebGL~/**', '.github/workflows/webgl-package.yml']
permissions:
  contents: read
jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test 'WebGL~/Tools/install.test.mjs'
